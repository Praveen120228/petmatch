<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specyf - Find Your Perfect Pet Match</title>
  <meta name="description"
    content="Specyf is the #1 pet match and pet matrimony platform. Find a pet date, adopt a pet, or connect with other pet owners near you." />
  <meta name="keywords"
    content="pet match, pet matrimony, pet date, pet dating, dog mating, cat mating, breed match, pet adoption, dog adoption, cat adoption, pets near me, Specyf" />

  <meta property="og:url" content="https://specyf.online/" />
  <meta property="og:title" content="Specyf - Find Your Perfect Pet Match" />

    content="Specyf is a pet adoption and matching platform connecting pets with loving homes." />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"

    crossorigin="" />

  <!-- Start Single Page Apps for GitHub Pages -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <!-- End Single Page Apps for GitHub Pages -->
